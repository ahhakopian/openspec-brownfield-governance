required_schema: spec-driven

context_append: |
  Persistent project knowledge:

  - `openspec/system/brownfield-map.md`
    Descriptive AS-IS system baseline: current capabilities, runtime topology,
    ownership, dependencies, trust boundaries, persistence/lifecycle,
    external integrations, evidence freshness, and known implementation/spec gaps.
    It is evidence about the existing system, not a TARGET architecture.

  - `openspec/roadmap.md`
    Persistent cross-change implementation roadmap covering candidate changes,
    dependencies/conflicts, preliminary sequence, and completed/deferred work.
    It is planning guidance only, not a behavioral specification, TARGET
    architecture, frozen design, or implementation authorization.

  - `docs/product/product-boundaries.md`
    Approved durable product boundaries and Product Evolution Policy.
    These constraints apply across future OpenSpec changes.

  - `docs/product/product-model.md` and `docs/product/access-model.md`, when present,
    define supporting product actors, roles, capabilities, surfaces, UX decisions,
    ownership, permissions, and access rules referenced by product boundaries.
    Treat only decisions explicitly marked Approved as normative.

  - `PRD.canonical.md`
    Canonical declared product requirements and invariants.

  - `openspec/deferred-changes/`
    Preserved prior planning work, not active implementation changes. When a new
    change overlaps deferred work, use that work as prior evidence before
    repeating research, but first reconcile it with current code/tests, the
    brownfield baseline, Approved product documents, and OpenSpec main specs.

  Source semantics:

  - For AS-IS implementation facts, ground conclusions in the current repository
    and relevant tests, using `brownfield-map.md` as the persistent system map.
  - For product intent and TARGET constraints, follow the canonical PRD and
    Approved product documents.
  - Do not silently resolve a disagreement between code, tests, the brownfield
    baseline, legacy specifications, and Approved product decisions.
    Surface the disagreement explicitly.
  - Legacy SpecKit plans, tasks, quickstarts, status documents, and README content
    are historical/supporting evidence unless corroborated by current evidence.
  - Open or otherwise non-Approved product decisions are not normative Approved
    decisions.
  - Planned or Deferred behavior may be Approved as future product direction,
    but is not current MVP/shipped scope until explicitly promoted by a separate
    Approved decision or change.
  - Deferred OpenSpec artifacts do not constitute such promotion or apply
    authorization and must not be treated as current requirements without fresh
    reconciliation and validation.
  - Current repository evidence, Approved product decisions, Product Boundaries,
    and current OpenSpec main specs outrank stale roadmap assumptions.

  Brownfield working rule:

  Before creating or materially revising an OpenSpec planning artifact, inspect
  the relevant current implementation/tests and the relevant portions of the
  persistent project documents above.

  Use stable IDs from the product documents to localize the affected scope.
  Do not reread or reproduce entire persistent documents when only a bounded
  subset is relevant.

  If the brownfield map is materially stale relative to the current repository,
  surface that fact instead of treating stale AS-IS information as current.

  Brownfield Simplicity Policy:

  - Prefer existing mechanisms for structural decisions: Reuse → Extend → Local
    Refactor → Introduce New.
  - Material new complexity requires a current requirement, existing architectural
    constraint, or real current variability; hypothetical future extensibility
    alone is insufficient.
  - Avoid unjustified parallel mechanisms, duplicate ownership, and additional
    sources of truth.
  - Simplicity does not weaken correctness, security, data integrity, required
    reliability, required compatibility, Approved Product Boundaries, or real
    architectural invariants.

  - `PRODUCT.md`, when present,
    Project-owned auxiliary durable context for native Impeccable workflows.
    It cannot override Approved product authority for durable product intent,
    OpenSpec for specified behavior, or the repository, relevant tests, and
    `brownfield-map.md` for AS-IS facts.

rules_append:
  proposal:
    - Before repeating research for a proposed scope, inspect `openspec/deferred-changes/README.md` and any relevant preserved deferred work; reconcile it with current code/tests, the brownfield baseline, Approved product documents, and OpenSpec main specs before reuse.
    - Before proposing scope represented by or overlapping `openspec/roadmap.md`, read its relevant dependencies, conflicts, sequence, and prior work, then revalidate them against the current state; do not treat the roadmap as frozen design.
    - Ground the proposal in the relevant current implementation, tests, and persistent brownfield baseline. Distinguish observed AS-IS behavior from the behavior proposed by this change.
    - In Impact, identify the materially affected ACT, ROLE, PCAP, SURF, UX, and PB stable IDs from the Approved product documents. Do not invent replacement IDs for existing concepts.
    - Treat Approved product decisions and Product Boundaries as stable by default. First seek a solution compatible with them.
    - If the requested change conflicts with an Approved decision, explicitly identify the conflicting stable IDs, explain the conflict and reasonable compatible alternatives, and identify any proposed product-model or boundary amendment. Do not treat that amendment as Approved without explicit human approval.
    - Never rewrite an existing Approved product decision merely because doing so makes implementation easier.
    - If the change introduces a new role, product capability, product surface, external data flow, personal store, semantic meaning, or authority, explicitly identify the required persistent product-model/boundary amendment rather than introducing it implicitly through implementation.

  design:
    - Read the proposal, the change specs when present, the affected AS-IS areas in `openspec/system/brownfield-map.md`, and the relevant Approved product/access/boundary decisions before choosing the technical approach.
    - Keep AS-IS evidence separate from TARGET design decisions. Do not treat `brownfield-map.md` as a desired architecture merely because it describes the current implementation.
    - Preserve affected Approved Product Boundaries and product/access decisions unless an explicit amendment has been approved. Reference the affected stable IDs when they materially constrain the design.
    - Assess architecture impact only where material to the change, including capability ownership, runtime or execution-context boundaries, process/message boundaries, trust and authorization boundaries, data authority/ownership, persistence/lifecycle/deletion, privacy/consent/information flow, external integrations, compatibility/versioning, and evidence semantics.
    - Do not impose a frontend/backend, service, container, database, account, or deployment split that is not justified by the actual system or the proposed change.
    - For an architecturally significant decision with multiple meaningful alternatives, compare the relevant alternatives and explain the selected trade-off. Do not manufacture alternatives when the decision is technically constrained.
    - Before introducing a materially new mechanism, evaluate reuse, extension, and bounded local refactoring of the existing system. Material new complexity must be justified by a current requirement, existing architectural constraint, or real current variability; hypothetical future variability alone is insufficient.
    - For structural or persistent-state changes, prefer incremental migration and address compatibility, recovery/restart behavior, cleanup, and rollback when they are materially relevant. Before adding edge-case recovery machinery, first consider invariant prevention, boundary validation/rejection, and the existing failure path.
    - If implementation of the proposed design would require changing an Approved product decision that has not been explicitly approved for amendment, surface that as a blocker rather than silently designing around it.

  tasks:
    - Derive implementation tasks from the approved proposal/specs/design rather than introducing new product scope, implementation infrastructure, responsibility paths, or architectural decisions absent from or unjustified by design.
    - Include appropriate verification for changed behavior and affected invariants using the project's existing unit, contract, property, integration, or E2E test layers where applicable.
    - Include a task, after implementation verification and before archive, to incrementally maintain `openspec/system/brownfield-map.md` for every Change: add implemented AS-IS architecture and remove or replace superseded AS-IS descriptions.
    - If the approved change explicitly amends Approved product, access, or boundary decisions, include the corresponding persistent-document update as part of the change.
    - Apart from the required brownfield-map maintenance, do not create documentation-update tasks for persistent documents that the change does not materially affect.

operations_append:
  apply:
    guidance:
      - Preserve the Approved product boundaries and scope recorded in the planning artifacts. Passing tests or implementation convenience is not approval to amend an Approved product decision.
      - After planning is complete and before the first application-code modification, determine semantically whether the Change materially affects UI. When it does, run `brownfield-ui-preflight`; on REVISE, do not modify application code, reconcile the affected planning, and rerun UI preflight until PASS.
      - After any applicable UI preflight has passed and before the first application-code modification, run `brownfield-complexity-gate` against the completed change planning and relevant existing architecture. On PASS, continue normal apply. On REVISE, do not modify application code; simplify or reconcile `design.md` and/or `tasks.md`, then rerun the gate.
      - If a later planning revision materially changes the user-visible interaction, rerun `brownfield-ui-preflight` and obtain PASS before rerunning `brownfield-complexity-gate`.
      - If implementation reveals a previously unidentified cross-capability, ownership, trust, data, lifecycle, privacy, compatibility, Product Boundary impact, or materially new architectural complexity or infrastructure not justified by approved design, surface the mismatch and reconcile the planning artifacts before absorbing it into implementation. Make the decision explicit and rerun `brownfield-complexity-gate` before implementing it.
      - Do not silently turn an implementation discovery into a new product decision.

  archive:
    guidance:
      - For every materially UI-affecting Change, complete normal implementation and task verification, obtain browser-verification evidence bounded to the affected UI behavior, and run native Impeccable `critique` against the implemented surface.
      - Reconcile the browser and native critique results through `brownfield-ui-conformance` until PASS, then perform final OpenSpec verification before the existing accepted-AS-IS and archive sequence.
      - Before archiving every verified Change, incrementally update `openspec/system/brownfield-map.md`: add newly existing AS-IS architecture from the implemented Change, and remove or replace AS-IS descriptions it superseded.
      - Check the updated map for internal architectural consistency only. If it is consistent, do not require a full repository/code/test/configuration validation or rescan.
      - If the map has an internal contradiction, localize the conflicting statements; inspect only the relevant repository code, tests, or configuration needed to resolve that contradiction; correct the map to the actual AS-IS; and repeat the internal-consistency check before archive.
      - "After the completed Change and its required brownfield-map maintenance, reconcile `openspec/roadmap.md`: mark completed work, reassess downstream dependencies/conflicts, and update the preliminary sequence when justified; do not create future change artifacts during roadmap refresh."
      - Update Approved product/access/boundary documents only for amendments that received explicit human approval; archive or spec synchronization is not approval to change them.
