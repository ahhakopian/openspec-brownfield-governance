    source: skills/cross-change-roadmap/SKILL.md
    target: .agents/skills/cross-change-roadmap/SKILL.md
    sha256: b2f11bcc1d7ed052c80aa5dec5c7e1b0b862b396d79f6df8b085186fffb2339d
  - name: brownfield-complexity-gate
    source: skills/brownfield-complexity-gate/SKILL.md
